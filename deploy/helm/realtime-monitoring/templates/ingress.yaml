{{- if .Values.ingress.enabled }}
{{- $host := .Values.ingress.host }}
{{- $className := .Values.ingress.className }}
---
# Single Ingress: two same-host Ingress objects merge unpredictably in nginx.
# /api (longest prefix) MUST come first, otherwise / swallows /api/*.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realtime-monitoring
  labels:
    app.kubernetes.io/part-of: realtime-monitoring
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
spec:
  ingressClassName: {{ $className | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.api.path }}
            pathType: {{ .Values.ingress.api.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .Values.ingress.api.serviceName | quote }}
                port:
                  number: {{ .Values.ingress.api.servicePort }}
          - path: /
            pathType: {{ .Values.ingress.frontend.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .Values.ingress.frontend.serviceName | quote }}
                port:
                  number: {{ .Values.ingress.frontend.servicePort }}
{{- end }}
