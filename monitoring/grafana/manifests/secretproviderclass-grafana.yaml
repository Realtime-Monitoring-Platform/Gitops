# =============================================================================
# Grafana admin credentials - Azure Key Vault -> Kubernetes Secret
# =============================================================================
# Resource reminder: this file creates a SecretProviderClass
# (secrets-store.csi.x-k8s.io/v1), NOT a Secret, so it NEVER shows up in
# `kubectl get secret`. Verify it with:
#   kubectl -n monitoring get secretproviderclass grafana-keyvault
# The Secret `grafana-admin-secret` appears only after the first pod mounts
# this class (SecretObjects sync), or after manual creation (see README).
# Reuses the SAME pattern as the application SecretProviderClasses
# (templates/secretproviderclass.yaml): workload identity + CSI driver.
# One-time setup (out of band, never committed):
#   az keyvault secret set --vault-name rtm-kv-9bd0f37e --name grafana-admin-password --value '<strong-password>'
#   az keyvault secret set --vault-name rtm-kv-9bd0f37e --name grafana-admin-user --value 'admin'
# =============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-keyvault
  namespace: monitoring
spec:
  provider: azure
  secretObjects:
    - secretName: grafana-admin-secret
      type: Opaque
      data:
        - objectName: grafana-admin-user
          key: admin-user
        - objectName: grafana-admin-password
          key: admin-password
  parameters:
    usePodIdentity: "false"
    clientID: "a9d7f4f9-6247-4cbb-bcfc-0eb9dc998659"
    keyvaultName: "rtm-kv-9bd0f37e"
    tenantId: "604f1a96-cbe8-43f8-abbf-f8eaf5d85730"
    objects: |
      array:
        - |
          objectName: grafana-admin-user
          objectType: secret
          objectAlias: grafana-admin-user
          objectVersion: ""
        - |
          objectName: grafana-admin-password
          objectType: secret
          objectAlias: grafana-admin-password
          objectVersion: ""
