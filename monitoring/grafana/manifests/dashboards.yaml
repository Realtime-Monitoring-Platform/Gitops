
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-spring-boot
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  spring-boot.json: |
    {
      "title": "Spring Boot / JVM overview",
      "uid": "spring-boot-jvm",
      "tags": ["spring-boot", "jvm", "micrometer"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "JVM heap used",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (service) (jvm_memory_used_bytes{area=\"heap\"})", "legendFormat": "{{service}}"}]
        },
        {
          "id": 2, "type": "timeseries", "title": "HTTP server requests /s",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (service) (rate(http_server_requests_seconds_count[5m]))", "legendFormat": "{{service}}"}]
        },
        {
          "id": 3, "type": "timeseries", "title": "HTTP p95 latency",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_server_requests_seconds_bucket[5m])))", "legendFormat": "{{service}}"}]
        },
        {
          "id": 4, "type": "stat", "title": "Services UP",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "count(up{job=\"realtime-monitoring-spring-boot\"} == 1)"}]
        }
      ]
    }
---
# =============================================================================
# Kubernetes pods overview (label: grafana_dashboard=1 -> auto-loaded)
# Uses kube-state-metrics + cAdvisor metrics shipped by kube-prometheus-stack.
# Compatible with community dashboard 6417/315 ideas, inlined to avoid pinning
# drift; replace with an imported dashboard ID if preferred.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-pods
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k8s-pods.json: |
    {
      "title": "Kubernetes pods overview",
      "uid": "k8s-pods",
      "tags": ["kubernetes", "pods"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Container CPU",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"realtime-monitoring\", container != \"\", container != \"POD\"}[5m]))", "legendFormat": "{{pod}}"}]
        },
        {
          "id": 2, "type": "timeseries", "title": "Container memory working set",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"realtime-monitoring\", container != \"\", container != \"POD\"})", "legendFormat": "{{pod}}"}]
        },
        {
          "id": 3, "type": "timeseries", "title": "Pod restarts",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"realtime-monitoring\"})", "legendFormat": "{{pod}}"}]
        },
        {
          "id": 4, "type": "stat", "title": "Running pods",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "count(kube_pod_status_phase{namespace=\"realtime-monitoring\", phase=\"Running\"} == 1)"}]
        }
      ]
    }
