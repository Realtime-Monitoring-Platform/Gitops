
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: realtime-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Realtime-Monitoring-Platform/Gitops.git
    targetRevision: main
    path: deploy/helm/realtime-monitoring
    helm:
      releaseName: realtime-monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: realtime-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

